version: '3.8'

services:
  # --- ATOMIC SERVICES ---
  waitlist-service:
    build: ./services/atomic/waitlist
    ports: ["5001:5001"]
    environment:
      - DB_URL=${DB_URL}
    networks:
      - esd-net

  payment-service:
    build: ./services/atomic/payment
    ports: ["5002:5002"]
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    networks:
      - esd-net

  notifications-service:
    build: ./services/atomic/notification
    ports: ["5003:5003"]
    environment:
      - DB_URL=${DB_URL}
    networks:
      - esd-net

  jobs-service:
    build: ./services/atomic/job
    ports: ["5004:5004"]
    dns: # Added to fix the 'could not translate host name' error
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DB_URL=${DB_URL}
    networks:
      - esd-net

  # --- COMPOSITE SERVICES ---
  job-posting:
    build: ./services/composite/job_posting
    ports: ["8080:8080"]
    depends_on:
      - jobs-service
      - notifications-service
    environment:
      - USER_SERVICE_URL=https://personal-c46vfcmj.outsystemscloud.com/UserService/rest
      - JOBS_SERVICE_URL=http://jobs-service:5004
      - NOTIF_SERVICE_URL=http://notifications-service:5003
    networks:
      - esd-net

  waitlist-manager:
    build: ./services/composite/waitlist_manager
    ports: ["8081:8081"]
    depends_on:
      - jobs-service
      - waitlist-service
    environment:
      - JOBS_SERVICE_URL=http://jobs-service:5004
      - WAITLIST_SERVICE_URL=http://waitlist-service:5001
      - NOTIF_SERVICE_URL=http://notifications-service:5003
    networks:
      - esd-net

  accept-gig:
    build: ./services/composite/accept_gig
    ports: ["8082:8082"]
    depends_on:
      - jobs-service
      - payment-service
    environment:
      # Added missing USER_SERVICE_URL for bank detail lookups
      - USER_SERVICE_URL=https://personal-c46vfcmj.outsystemscloud.com/UserService/rest
      - JOBS_SERVICE_URL=http://jobs-service:5004
      - WAITLIST_SERVICE_URL=http://waitlist-service:5001
      - PAYMENT_SERVICE_URL=http://payment-service:5002
      - NOTIF_SERVICE_URL=http://notifications-service:5003
    networks:
      - esd-net

networks:
  esd-net:
    driver: bridge