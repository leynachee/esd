version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: esd-rabbit
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - esd-net

  error-handler:
    build: ./services/atomic/error_handler
    restart: always
    environment:
      - RABBIT_HOST=rabbitmq
      - PYTHONUNBUFFERED=1
    depends_on:
      - rabbitmq
    networks:
      - esd-net

  # --- ATOMIC SERVICES ---
  waitlist-service:
    build: ./services/atomic/waitlist
    # ports: ["5001:5001"] <-- REMOVED: Internal only
    environment:
      - RABBIT_HOST=rabbitmq
      - DB_URL=${DB_URL}
      - PYTHONUNBUFFERED=1
    networks:
      - esd-net

  payment-service:
    build: ./services/atomic/payment
    environment:
      - RABBIT_HOST=rabbitmq
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - DB_URL=${DB_URL}
      - PYTHONUNBUFFERED=1
    networks:
      - esd-net

  notifications-service:
    build: ./services/atomic/notification
    environment:
      - RABBIT_HOST=rabbitmq
      - DB_URL=${DB_URL}
      - PYTHONUNBUFFERED=1
    networks:
      - esd-net

  jobs-service:
    build: ./services/atomic/job
    # ports: ["5004:5004"] <-- REMOVED: Internal only
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - DB_URL=${DB_URL}
      - PYTHONUNBUFFERED=1
    networks:
      - esd-net

  # --- COMPOSITE SERVICES (Step 2: Routed through Kong only) ---
  job-posting:
    build: ./services/composite/job_posting
    # ports: ["8080:8080"] <-- REMOVED: Securely routed via Kong
    depends_on:
      - jobs-service
      - notifications-service
    deploy:
      replicas: 2           # Lab Scaling Requirement
    environment:
      - RABBIT_HOST=rabbitmq
      - USER_SERVICE_URL=https://personal-c46vfcmj.outsystemscloud.com/UserService/rest
      - JOBS_SERVICE_URL=http://jobs-service:5004
      - PYTHONUNBUFFERED=1  # Lab Logging Requirement
    networks:
      - esd-net

  waitlist-manager:
    build: ./services/composite/waitlist_manager
    # ports: ["8081:8081"] <-- REMOVED: Securely routed via Kong
    depends_on:
      - jobs-service
      - waitlist-service
    deploy:
      replicas: 2
    environment:
      - JOBS_SERVICE_URL=http://jobs-service:5004
      - WAITLIST_SERVICE_URL=http://waitlist-service:5001
      - RABBIT_HOST=rabbitmq
      - PYTHONUNBUFFERED=1
    networks:
      - esd-net

  accept-gig:
    build: ./services/composite/accept_gig
    # ports: ["8082:8082"] <-- REMOVED: Securely routed via Kong
    depends_on:
      - jobs-service
      - payment-service
    deploy:
      replicas: 2
    environment:
      - USER_SERVICE_URL=https://personal-c46vfcmj.outsystemscloud.com/UserService/rest
      - JOBS_SERVICE_URL=http://jobs-service:5004
      - WAITLIST_SERVICE_URL=http://waitlist-service:5001
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - RABBIT_HOST=rabbitmq
      - PYTHONUNBUFFERED=1
    networks:
      - esd-net

volumes:
  rabbitmq_data:
networks:
  esd-net:
    driver: bridge